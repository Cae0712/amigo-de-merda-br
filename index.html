<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171421">
<title>Amigo de Merda BR</title>
<style>
:root { color-scheme: dark; --bg: #171421; --panel: #242033; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: #fff; font-family: system-ui, sans-serif; }
main { max-width: 760px; margin: auto; padding: 24px 16px 50px; }
@media (max-width: 440px) { main { padding: 18px 12px 35px; } }
.btn { background: #adff2f; color: #000; font-weight: bold; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
.panel { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="logo"><span>AMIGO DE MERDA BR</span></div>
  </header>
  <div id="app">
    <section class="panel hero">
      <span>Carregando...</span>
    </section>
  </div>
  <div class="footer">AMIGO DE MERDA BR · JOGUE COM AMIGOS</div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ATENÇÃO: Substitua os valores abaixo com as chaves reais do seu painel Supabase
const SUPABASE_URL = 'COLE_AQUI_A_URL_DO_SEU_PROJETO'
const SUPABASE_ANON_KEY = 'COLE_AQUI_A_CHAVE_ANON_PUBLICA'

const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('COLE_AQUI')
const app = document.querySelector('#app')
let db = null, room = null, me = null, profile = null, subscription = null

const em = ['😎','🤡','🤠','😈','🦆','🎉','👽','🗿','🦁','🦊']
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const code = () => Math.random().toString(36).slice(2, 6).toUpperCase()

function message(s) { alert(s) }
function btn(t, id, cls='btn') { return `<button class="${cls}" id="${id}">${t}</button>` }

function needConfig() {
  if (!configured) {
    message('Por favor, configure as chaves do Supabase no ficheiro index.html.')
    return true
  }
  return false
}

if (configured) {
  db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
}

function home() {
  app.innerHTML = `
    <section class="panel hero">
      <h2>Seus amigos. Suas perguntas. Seu julgamento.</h2>
      <p>Crie uma sala privada, convide a galera pelo código e descubra quem vai levar o título.</p>
      ${btn('CRIAR SALA', 'create')}
      <div style="margin-top:20px;">
        <input type="text" id="roomCode" placeholder="CÓDIGO DA SALA" style="width:100%; padding:10px; border-radius:6px; border:none; text-transform:uppercase;">
        ${btn('ENTRAR NA SALA', 'join')}
      </div>
    </section>
  `
  
  const createBtn = document.querySelector('#create')
  if (createBtn) {
    createBtn.onclick = () => {
      if (needConfig()) return
      setup()
    }
  }

  const joinBtn = document.querySelector('#join')
  if (joinBtn) {
    joinBtn.onclick = () => {
      if (needConfig()) return
      const inputCode = document.querySelector('#roomCode').value.trim().toUpperCase()
      if (!inputCode) return message('Digite o código da sala!')
      joinRoom(inputCode)
    }
  }
}

function setup() {
  app.innerHTML = `
    <section class="panel">
      <h3>Criar Nova Sala</h3>
      <p>A carregar configuração de sala...</p>
      ${btn('VOLTAR', 'back')}
    </section>
  `
  const backBtn = document.querySelector('#back')
  if (backBtn) backBtn.onclick = () => home()
}

async function joinRoom(roomCode) {
  app.innerHTML = `
    <section class="panel">
      <h3>Entrando na sala ${esc(roomCode)}...</h3>
    </section>
  `
}

// Inicializa a interface inicial
home()
</script>
</body>
</html>
